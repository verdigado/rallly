on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  build-and-release:
    name: Create Release
    # Pre-release tags (v4.12.3-rc.1) exist to publish a pinned Docker image
    # for validation — they must not deploy production or draft a release.
    # Our own fork release tags (v4.13.1-fork.1) also contain a hyphen but
    # are not pre-releases, so match the actual -rc. pattern rather than
    # any hyphen.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Create release artifact
        run: ./scripts/create-release-artifact.sh

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "rallly-release.tar.gz,rallly-release.tar.gz.sha256"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          makeLatest: true
